        location: "EKO_HOTEL_BALLROOM"
      - title: "Chioma's Heartbreak"
        location: "SURULERE_STREET_NIGHT"
      - title: "Tunde's Betrayal"
        location: "VICTORIA_ISLAND_RESTAURANT"

  - name: "THE SEPARATION"
    scenes:
      - title: "The Confrontation with Father"
        location: "ADEBAYO_MANSION_STUDY"
      - title: "Dele's Choice"
        location: "PASTOR_EMMANUELS_CHURCH"
      - title: "Chioma's Decision"
        location: "CHIIOMA_HOUSE_MORNING"
      - title: "The Journey to Ibadan"
        location: "LAGOS_IBADAN_EXPRESSWAY"
      - title: "Grandmother's Wisdom"
        location: "IBADAN_COMPOUND"

  - name: "THE RETURN"
    scenes:
      - title: "Dele's Proof"
        location: "SURULERE_WORKSHOP_REBUILT"
