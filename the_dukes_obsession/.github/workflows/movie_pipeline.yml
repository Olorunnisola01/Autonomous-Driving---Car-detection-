# ============================================================================
# Movie Pipeline — Automated Storyboard Gallery Generator
# ============================================================================
# This workflow:
#   1. Reads movie_config.yaml
#   2. Generates screenplay with voiceovers
#   3. Generates all images (API or placeholders)
#   4. Builds HTML gallery
#   5. Deploys to GitHub Pages
#
# Trigger: Manual (workflow_dispatch) or on push to main
# ============================================================================

name: Movie Pipeline

on:
  # Manual trigger with form inputs
  workflow_dispatch:
    inputs:
      mode:
        description: 'Generation mode'
        required: true
        default: 'placeholder'
        type: choice
        options:
          - placeholder
          - api
          - rebuild-only
      api_key:
        description: 'OpenAI API key (only needed for mode=api)'
        required: false
        default: ''

  # Auto-run on changes to the pipeline or config
  push:
    branches: [main, arena/*]
    paths:
      - 'movie_config.yaml'
      - 'generate_*.py'
      - 'build_gallery.py'
      - '.github/workflows/movie_pipeline.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    concurrency:
      group: "movie-pipeline"
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyYAML Pillow
          pip install openai imageio imageio-ffmpeg

      - name: Read config
        id: config
        run: |
          echo "=== Movie Configuration ==="
          cat movie_config.yaml | head -30
          echo ""
          echo "==========================="

      - name: Generate screenplay
        run: |
          echo "Generating screenplay from config..."
          python generate_screenplay.py --config movie_config.yaml --output output/SCREENPLAY.md
          echo ""
          echo "=== Generated Screenplay (first 50 lines) ==="
          head -50 output/SCREENPLAY.md

      - name: Generate images
        env:
          OPENAI_API_KEY: ${{ github.event.inputs.api_key != '' && github.event.inputs.api_key || secrets.OPENAI_API_KEY || '' }}
        run: |
          MODE="${{ github.event.inputs.mode || 'placeholder' }}"
          echo "Mode: $MODE"
          
          if [ "$MODE" = "api" ]; then
            if [ -z "$OPENAI_API_KEY" ]; then
              echo "❌ No API key provided. Set OPENAI_API_KEY secret or pass it as input."
              exit 1
            fi
            echo "Generating images via OpenAI API..."
            python generate_images.py \
              --config movie_config.yaml \
              --api-key "$OPENAI_API_KEY" \
              --output-dir output/images
          elif [ "$MODE" = "rebuild-only" ]; then
            echo "Skipping image generation (rebuild-only mode)"
          else
            echo "Generating placeholder images..."
            python generate_images.py \
              --config movie_config.yaml \
              --placeholder-only \
              --output-dir output/images
          fi

      - name: Build gallery HTML
        run: |
          echo "Building gallery..."
          python build_gallery.py \
            --config movie_config.yaml \
            --image-dir output/images \
            --output output/storyboard_gallery.html

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: storyboard-gallery
          path: output/
          retention-days: 30

      - name: Commit generated files
        run: |
          git config --global user.name "Movie Pipeline Bot"
          git config --global user.email "pipeline@github-actions.com"
          git add output/
          git commit -m "🎬 Auto-generated: movie pipeline run" || echo "Nothing to commit"
          git push

  deploy:
    needs: build
    if: ${{ github.event.inputs.mode != 'rebuild-only' || true }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: storyboard-gallery
          path: output/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: output/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
